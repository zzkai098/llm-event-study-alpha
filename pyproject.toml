[project]
name = "llm-portfolio-agent"
version = "0.1.0"
description = "LLM-powered active portfolio management agent (Claude + RAG + CNN)"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Data processing
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    # Market data
    "yfinance>=0.2.40",
    # Machine learning
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.0",            # Intel Mac caps at 2.2.2; other platforms get newer
    # LLM pipeline
    "openai>=1.0",           # chat (gpt-4o*) + embeddings (text-embedding-3-large)
    # Technical indicators
    "ta>=0.11",
    # Plotting
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # Utilities
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
